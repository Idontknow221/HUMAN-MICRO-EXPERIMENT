<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F5F3EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111311" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Micro-Exp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@600&display=swap">
<title>HUMAN MICRO-EXPERIMENT</title>
<style>
/* ============================================================
   DESIGN TOKENS — Editorial Science
   ============================================================ */
:root{
  --color-background:#F5F3EC;
  --color-surface:#FBFAF6;
  --color-surface-2:#EDEAE1;
  --color-text-primary:#1B1C19;
  --color-text-secondary:#585B55;
  --color-text-tertiary:#878A83;
  --color-border:#E1DDD2;
  --color-border-strong:#C9C4B6;
  --color-accent:#2E5842;
  --color-accent-soft:#E2EAE2;
  --color-on-accent:#F7F6F1;
  --color-success:#2E6A46;
  --color-warning:#94600E;
  --color-warning-soft:#F4E9D2;
  --color-danger:#9E3826;
  --color-danger-soft:#F4E0DA;
  --font-sans:"Inter","IBM Plex Sans","Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-display:"Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU",Georgia,serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fs-display:30px;--fs-h2:19px;--fs-h3:16px;--fs-body:15px;--fs-meta:13px;--fs-cap:12px;
  --r-sm:3px;--r:6px;--nav-h:58px;--side-w:224px;
  --ease:cubic-bezier(.2,.7,.2,1);--dur:160ms;
  /* legacy aliases used inside SVG strings */
  --bg:var(--color-background);--surface:var(--color-surface);--ink:var(--color-text-primary);--ink2:var(--color-text-secondary);
  --muted:var(--color-text-tertiary);--line:var(--color-border);--line2:var(--color-border-strong);--accent:var(--color-accent);
}
@media (prefers-color-scheme: dark){
  :root{
    --color-background:#111311;--color-surface:#181A18;--color-surface-2:#1F221F;
    --color-text-primary:#E8E7E1;--color-text-secondary:#A9ABA4;--color-text-tertiary:#7D807A;
    --color-border:#2A2D29;--color-border-strong:#3B3F3A;
    --color-accent:#8FBFA1;--color-accent-soft:#1B2A21;--color-on-accent:#0E120F;
    --color-success:#8FBFA1;--color-warning:#D8A54C;--color-warning-soft:#2A2315;--color-danger:#DE826F;--color-danger-soft:#2D1A16;
  }
}
@media (min-width:768px){:root{--fs-display:36px;--fs-h2:20px}}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--color-background);color:var(--color-text-primary);font-family:var(--font-sans);font-size:var(--fs-body);line-height:1.6;font-feature-settings:"cv11","ss01"}
body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
a{color:var(--color-accent);text-underline-offset:3px;text-decoration-thickness:1px}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.muted{color:var(--color-text-tertiary)}.ink2{color:var(--color-text-secondary)}
.small{font-size:var(--fs-meta)}.xs{font-size:var(--fs-cap)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- typography scale ---- */
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.005em}
h1,.display{font-family:var(--font-display);font-size:var(--fs-display);line-height:1.18;font-weight:600}
h2,.section-h{font-family:var(--font-sans);font-size:var(--fs-h2);line-height:1.35;font-weight:600}
h3,.card-h{font-size:var(--fs-h3);line-height:1.4;font-weight:600}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-text-tertiary);font-weight:500}
.meta{font-size:var(--fs-meta);color:var(--color-text-secondary)}
.caption{font-size:var(--fs-cap);color:var(--color-text-tertiary);line-height:1.5}
.lede{font-size:var(--fs-body);color:var(--color-text-secondary);max-width:60ch}

/* ============================================================
   SHELL — header, nav (bottom on mobile, side rail on desktop)
   ============================================================ */
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:20;background:var(--color-background);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--color-border)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:52px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px;letter-spacing:.08em;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.brand{font-size:11.5px;letter-spacing:.05em;gap:8px}}
.brand .mark{font-family:var(--font-mono);font-weight:500;font-size:12px;padding:1px 6px;border:1px solid var(--color-text-primary);border-radius:var(--r-sm);letter-spacing:0}
.brand small{font-weight:400;font-size:12px;color:var(--color-text-tertiary);letter-spacing:.02em}
.iconbtn{white-space:nowrap;flex:none;background:transparent;border:1px solid var(--color-border-strong);border-radius:var(--r);min-width:44px;height:36px;padding:0 12px;font-size:13px;color:var(--color-text-secondary);transition:background var(--dur) var(--ease)}
.iconbtn:hover{background:var(--color-surface-2)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--color-surface);border-top:1px solid var(--color-border);padding-bottom:env(safe-area-inset-bottom);transition:transform var(--dur) var(--ease)}
nav.bottom .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0}
nav.bottom a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:var(--nav-h);text-decoration:none;color:var(--color-text-tertiary);font-size:10px;letter-spacing:.06em;gap:1px}
nav.bottom a b{font-size:14px;font-weight:500;letter-spacing:.02em;color:var(--color-text-secondary)}
nav.bottom a.on b{color:var(--color-text-primary);font-weight:600}
nav.bottom a.on::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:2px;background:var(--color-accent)}
body.kbd nav.bottom{transform:translateY(110%)}
@media (min-width:1024px){
  body{padding-bottom:40px;padding-left:var(--side-w)}
  header.top{display:none}
  nav.bottom{top:0;right:auto;width:var(--side-w);border-top:0;border-right:1px solid var(--color-border);background:var(--color-background);padding:28px 0 0}
  nav.bottom .wrap{display:flex;flex-direction:column;padding:0 16px;gap:2px}
  nav.bottom .wrap::before{content:"HUMAN MICRO-EXPERIMENT";font-size:11px;letter-spacing:.14em;font-weight:600;padding:0 12px 6px}
  nav.bottom .wrap::after{content:"N-of-1 個人研究平台";font-size:12px;color:var(--color-text-tertiary);padding:0 12px 24px;order:-1;display:none}
  nav.bottom a{flex-direction:row;justify-content:space-between;height:44px;padding:0 12px;border-radius:var(--r);font-size:11px}
  nav.bottom a b{font-size:15px}
  nav.bottom a:hover{background:var(--color-surface-2)}
  nav.bottom a.on{background:var(--color-surface-2)}
  nav.bottom a.on::before{top:10px;bottom:10px;left:0;right:auto;width:2px;height:auto}
  .side-data{display:block!important}
}
.side-data{display:none;margin:24px 28px 0;font-size:13px}
main#app{padding-top:4px;animation:pagein 180ms var(--ease)}
@keyframes pagein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ============================================================
   PAGE HEADER
   ============================================================ */
.phead{padding:26px 0 18px;border-bottom:1px solid var(--color-text-primary);margin-bottom:6px}
.phead .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.phead .lede{margin-top:8px}
.dnav{display:flex;gap:6px;flex:none}
.dnav button{width:44px;height:44px;border:1px solid var(--color-border-strong);background:var(--color-surface);border-radius:var(--r);font-size:18px;line-height:1;color:var(--color-text-secondary);transition:background var(--dur) var(--ease)}
.dnav button:hover{background:var(--color-surface-2)}
.dnav button:active{transform:translateY(1px)}
.ctx{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:var(--fs-meta);color:var(--color-text-secondary)}
.ctx .num{color:var(--color-text-primary)}
.ctx a{font-weight:500}

/* ============================================================
   SECTIONS & LAYOUT
   ============================================================ */
.sec{padding:22px 0 6px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;padding-bottom:10px;border-bottom:1px solid var(--color-border);margin-bottom:4px}
.sec-h h2{font-size:var(--fs-h2)}
.sec-h .aside{font-size:var(--fs-cap);color:var(--color-text-tertiary);font-family:var(--font-mono)}
.grid2{display:block}
@media (min-width:1024px){
  .wrap{padding:0 40px}
  .grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0 48px;align-items:start}
  .grid2.even{grid-template-columns:1fr 1fr}
  .grid2 > .col-r{position:sticky;top:20px}
}
@media (min-width:768px) and (max-width:1023px){.wrap{padding:0 32px}}

/* ============================================================
   TODAY — focus block
   ============================================================ */
.focus{margin:18px 0 6px;padding:18px 18px 18px 20px;background:var(--color-surface);border:1px solid var(--color-border);border-left:3px solid var(--color-accent);border-radius:0 var(--r) var(--r) 0}
.focus .k{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.focus h2{font-family:var(--font-display);font-size:24px;line-height:1.3;margin:6px 0 4px}
.focus p{margin:8px 0 0;color:var(--color-text-secondary);font-size:var(--fs-body)}
.focus.clear{border-left-color:var(--color-border-strong)}
.focus.clear h2{font-size:20px}

/* status figures */
.figs{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--color-border)}
.figs>div{padding:12px 0 12px;border-bottom:1px solid var(--color-border)}
.figs>div:nth-child(odd){padding-right:12px;border-right:1px solid var(--color-border)}
.figs>div:nth-child(even){padding-left:14px}
.fig-v{font-family:var(--font-mono);font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.fig-v small{font-size:13px;color:var(--color-text-tertiary);margin-left:2px}
.fig-v.na{font-size:15px;color:var(--color-text-tertiary);font-family:var(--font-sans);line-height:1.9}
.fig-l{font-size:var(--fs-cap);color:var(--color-text-tertiary)}
@media (min-width:600px){.figs.four{grid-template-columns:repeat(4,1fr)}.figs.four>div{border-right:1px solid var(--color-border);padding:12px 12px}.figs.four>div:last-child{border-right:0}.figs.four>div:first-child{padding-left:0}}

/* ============================================================
   TASK ROWS (protocol list — not identical cards)
   ============================================================ */
.tasks{border-top:1px solid var(--color-border)}
.task{border-bottom:1px solid var(--color-border)}
.task-main{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 0}
.task-main .tx{flex:1;min-width:0;background:none;border:0;text-align:left;padding:4px 0;cursor:pointer}
.task-title{font-size:15px;font-weight:500;line-height:1.4;color:var(--color-text-primary)}
.task-meta{font-size:var(--fs-cap);color:var(--color-text-tertiary);margin-top:2px;font-family:var(--font-sans)}
.task-meta .num{color:var(--color-text-secondary)}
.task.is-done .task-title{color:var(--color-text-tertiary);text-decoration:line-through;text-decoration-color:var(--color-border-strong)}
.task.is-off .task-title{color:var(--color-text-tertiary)}
.chk{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:none;padding:0}
.chk i{width:22px;height:22px;border:1.5px solid var(--color-border-strong);border-radius:var(--r-sm);display:block;position:relative;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.chk:hover i{border-color:var(--color-accent)}
.chk.on i{background:var(--color-accent);border-color:var(--color-accent)}
.chk.on i::after{content:"";position:absolute;left:6.5px;top:2.5px;width:5px;height:10px;border:solid var(--color-on-accent);border-width:0 2px 2px 0;transform:rotate(45deg)}
.chk.off i{border-style:dashed}
.chk.on i{animation:tick 220ms var(--ease)}
@keyframes tick{0%{transform:scale(.85)}100%{transform:scale(1)}}
.task-detail{padding:0 0 16px 56px;font-size:14px;color:var(--color-text-secondary)}
.task-detail p{margin:0 0 10px}
.status-line{font-size:var(--fs-cap);margin-bottom:8px;color:var(--color-text-secondary)}
.status-line .done{color:var(--color-success)}
.status-line .warn{color:var(--color-warning)}
.counter{display:flex;align-items:center;gap:0;flex:none;border:1px solid var(--color-border-strong);border-radius:var(--r);overflow:hidden;background:var(--color-surface)}
.counter button{width:40px;height:40px;border:0;background:none;font-size:18px;color:var(--color-text-secondary)}
.counter button:active{background:var(--color-surface-2)}
.counter .n{font-family:var(--font-mono);font-size:15px;min-width:42px;text-align:center;border-left:1px solid var(--color-border);border-right:1px solid var(--color-border);line-height:40px}
.counter.big .n{min-width:56px;font-size:20px}
.counter.big button{width:52px;height:46px}

/* definition list (spec sheet) */
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 14px;font-size:14px;margin:0}
.kv dt{color:var(--color-text-tertiary);font-size:var(--fs-cap);padding-top:2px}
.kv dd{margin:0;color:var(--color-text-primary)}
.spec{display:grid;grid-template-columns:1fr;border-top:1px solid var(--color-text-primary)}
.sec-h+.spec,.sec-h+.figs,.sec-h+.tasks{border-top:0;margin-top:-4px}
.chart{max-width:560px}
.counter-spacer{width:0}
.spec>div{display:grid;grid-template-columns:112px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--color-border);font-size:14px}
.spec dt{font-size:var(--fs-cap);color:var(--color-text-tertiary);padding-top:2px}
.spec dd{margin:0}
@media (min-width:768px){.spec{grid-template-columns:1fr 1fr;column-gap:32px}.spec>div.full{grid-column:1/-1}}

/* evidence grade — restrained, consistent */
.ev{display:inline-flex;align-items:baseline;gap:5px;font-size:var(--fs-cap);color:var(--color-text-tertiary);white-space:nowrap}
.ev b{font-family:var(--font-mono);font-weight:600;font-size:13px;color:var(--color-text-primary);border-bottom:1.5px solid currentColor;line-height:1.1}
.ev.g-A b,.ev.g-B b{color:var(--color-accent)}
.ev.g-D b,.ev.g-E b{color:var(--color-danger)}
.grade{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;font-family:var(--font-mono);font-size:12px;font-weight:600;border:1px solid var(--color-border-strong);border-radius:var(--r-sm);color:var(--color-text-secondary);padding:0 4px}

/* status text marker (no pills) */
.st{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-cap);color:var(--color-text-secondary);white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:1px;background:var(--color-border-strong)}
.st.active::before{background:var(--color-accent)}
.st.scheduled::before{background:transparent;border:1.5px solid var(--color-accent);width:5px;height:5px}
.st.paused::before{background:var(--color-warning)}
.st.removed::before{background:var(--color-text-tertiary)}

/* ============================================================
   BUTTONS
   ============================================================ */
.btnrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:var(--r);border:1px solid var(--color-border-strong);background:var(--color-surface);font-size:15px;font-weight:500;color:var(--color-text-primary);transition:background var(--dur) var(--ease),transform 80ms;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{background:var(--color-surface-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--color-text-primary);color:var(--color-background);border-color:var(--color-text-primary)}
.btn.pri:hover{opacity:.9}
.btn.acc{background:var(--color-accent);color:var(--color-on-accent);border-color:var(--color-accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--color-text-secondary)}
.btn.ghost:hover{background:var(--color-surface-2)}
.btn.danger{border-color:var(--color-danger);color:var(--color-danger);background:transparent}
.btn.grow{flex:1}
.btn.sm{min-height:36px;font-size:13px;padding:0 12px}
.btn:disabled{opacity:.4}
.linkbtn{background:none;border:0;padding:8px 0;min-height:36px;color:var(--color-accent);font-size:var(--fs-meta);font-weight:500}

/* ============================================================
   NOTICES
   ============================================================ */
.notice,.info{padding:11px 14px;font-size:14px;margin:12px 0;border-radius:var(--r);line-height:1.55}
.notice{background:var(--color-warning-soft);color:var(--color-text-primary);border:1px solid color-mix(in srgb,var(--color-warning) 30%,transparent)}
.notice b{color:var(--color-warning)}
.info{background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text-secondary)}
.notice.danger{background:var(--color-danger-soft);border-color:color-mix(in srgb,var(--color-danger) 30%,transparent)}
.empty{padding:22px 0;color:var(--color-text-tertiary);font-size:14px}
.insuff{font-size:var(--fs-cap);color:var(--color-text-tertiary);padding:14px 0;border:1px dashed var(--color-border-strong);border-radius:var(--r);text-align:center;margin:6px 0}

/* ============================================================
   FORMS / JOURNAL
   ============================================================ */
.field{margin:14px 0}
.field label,.flabel{display:block;font-size:var(--fs-meta);color:var(--color-text-secondary);margin-bottom:6px;font-weight:500}
.field .hint,.hint{font-size:var(--fs-cap);color:var(--color-text-tertiary);margin-top:5px}
input[type=time],input[type=date],input[type=number],input[type=text],input[type=search],select,textarea{width:100%;min-height:44px;border:1px solid var(--color-border-strong);border-radius:var(--r);background:var(--color-surface);padding:9px 12px;font-size:16px;transition:border-color var(--dur) var(--ease)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--color-accent);box-shadow:0 0 0 3px var(--color-accent-soft)}
textarea{min-height:84px;resize:vertical;line-height:1.6}
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.entry{display:grid;grid-template-columns:34px 1fr;gap:0 10px;padding:18px 0 8px;border-bottom:1px solid var(--color-border)}
.entry>.no{font-family:var(--font-mono);font-size:12px;color:var(--color-text-tertiary);padding-top:3px}
.entry h3{font-size:16px;margin-bottom:2px}
.entry .field:first-of-type{margin-top:10px}
@media (min-width:768px){.entry{grid-template-columns:56px 1fr}}
.notebook{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--r);padding:4px 14px}
.notebook textarea{border:0;background:transparent;padding:10px 0;min-height:96px;box-shadow:none!important;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--color-border) 25px,var(--color-border) 26px);background-attachment:local;line-height:26px}
.scale{display:grid;grid-template-columns:repeat(10,1fr);border:1px solid var(--color-border-strong);border-radius:var(--r);overflow:hidden;background:var(--color-surface)}
.scale button{height:42px;border:0;border-right:1px solid var(--color-border);background:transparent;font-family:var(--font-mono);font-size:14px;padding:0;color:var(--color-text-secondary);transition:background var(--dur) var(--ease)}
.scale button:last-child{border-right:0}
.scale button.on{background:var(--color-text-primary);color:var(--color-background)}
.scaledef{font-size:var(--fs-cap);color:var(--color-text-tertiary);margin-top:5px;min-height:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:38px;padding:0 12px;border:1px solid var(--color-border-strong);border-radius:var(--r);background:var(--color-surface);font-size:14px;color:var(--color-text-secondary);transition:background var(--dur) var(--ease)}
.chips button.on{background:var(--color-text-primary);color:var(--color-background);border-color:var(--color-text-primary)}
.savebar{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);z-index:10;display:flex;align-items:center;gap:12px;padding:10px 12px;margin-top:20px;background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--r);box-shadow:0 6px 20px -12px rgba(0,0,0,.25)}
.savebar .state{flex:1;font-size:var(--fs-cap);color:var(--color-text-tertiary)}
.savebar .state.dirty{color:var(--color-warning)}
body.kbd .savebar{bottom:8px}
@media (min-width:1024px){.savebar{bottom:16px}}
.seg{display:flex;border:1px solid var(--color-border-strong);border-radius:var(--r);overflow:hidden;margin:16px 0 4px;background:var(--color-surface)}
.seg button{flex:1;min-height:40px;border:0;background:transparent;font-size:14px;color:var(--color-text-secondary)}
.seg button+button{border-left:1px solid var(--color-border)}
.seg button.on{background:var(--color-text-primary);color:var(--color-background);font-weight:500}

/* ============================================================
   DATA / CHARTS / TABLES
   ============================================================ */
.chart{margin:4px 0 0;position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y;overflow:visible}
.chart .tip{font-size:var(--fs-cap);color:var(--color-text-secondary);min-height:20px;font-family:var(--font-mono);margin-top:2px}
.chartbox{padding:14px 0 8px;border-bottom:1px solid var(--color-border)}
.chartbox .ct{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chartbox .ct b{font-size:14px;font-weight:600}
.chartbox .ct span{font-size:var(--fs-cap);color:var(--color-text-tertiary);font-family:var(--font-mono);text-align:right}
.chartbox .cs{font-size:var(--fs-cap);color:var(--color-text-tertiary);margin-top:1px}
.charts{display:block}
@media (min-width:768px){.charts{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}}
.spark{display:grid;grid-template-columns:96px 1fr 64px;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--color-border);font-size:13px}
.spark .sv{font-family:var(--font-mono);text-align:right;font-size:13px}
.spark svg{display:block;width:100%;height:28px}
.spark .na{font-size:var(--fs-cap);color:var(--color-text-tertiary)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:9px 6px;border-bottom:1px solid var(--color-border);text-align:right;vertical-align:top}
table.t th:first-child,table.t td:first-child{text-align:left;padding-left:0}
table.t th:last-child,table.t td:last-child{padding-right:0}
table.t th{white-space:nowrap}
table.t thead th,table.t tr:first-child th{font-weight:500;color:var(--color-text-tertiary);font-size:var(--fs-cap);border-bottom:1px solid var(--color-text-primary)}
table.t td.l{text-align:left}
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0}
.week7 div{text-align:center;font-size:11px;color:var(--color-text-tertiary)}
.week7 i{display:block;height:44px;border:1px solid var(--color-border-strong);border-radius:var(--r-sm);margin-bottom:4px;background:var(--color-surface);position:relative;overflow:hidden}
.week7 i s{position:absolute;left:0;right:0;bottom:0;background:var(--color-accent);text-decoration:none}
.list-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--color-border);font-size:14px}
.list-row .num{white-space:nowrap}
.activity{list-style:none;margin:0;padding:0}
.activity li{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--color-border);font-size:13px}
.activity time{font-family:var(--font-mono);font-size:12px;color:var(--color-text-tertiary)}
.lbl-fact{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--color-text-tertiary);border:1px solid var(--color-border-strong);padding:0 4px;border-radius:var(--r-sm);margin-right:5px;vertical-align:1px}

/* ============================================================
   EXPERIMENT INDEX
   ============================================================ */
.xrow{display:grid;grid-template-columns:64px 1fr auto;gap:4px 12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--color-border);text-decoration:none;color:inherit;transition:background var(--dur) var(--ease)}
.xrow:hover{background:var(--color-surface-2)}
.xrow .xid{font-family:var(--font-mono);font-size:12px;color:var(--color-text-tertiary);padding-top:3px}
.xrow .xn{font-size:15px;font-weight:500;line-height:1.4}
.xrow .xm{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:var(--fs-cap);color:var(--color-text-tertiary)}
.xrow .xr{text-align:right;padding-top:2px}
.xrow.primary .xn{font-family:var(--font-display);font-size:19px;font-weight:600}
.xrow.primary{padding:18px 0}

/* ============================================================
   RESEARCH
   ============================================================ */
.ref{padding:14px 0;border-bottom:1px solid var(--color-border)}
.ref .rid{display:flex;justify-content:space-between;gap:8px;font-family:var(--font-mono);font-size:11px;color:var(--color-text-tertiary);letter-spacing:.02em}
.ref .rt{font-family:var(--font-display);font-size:16px;line-height:1.45;margin:4px 0 4px;font-weight:600}
.ref .ra{font-size:13px;color:var(--color-text-secondary)}
.ref .rl{font-size:12px;font-family:var(--font-mono);margin-top:4px;word-break:break-all}
.ref details summary{font-size:var(--fs-cap);color:var(--color-accent);cursor:pointer;margin-top:8px;list-style:none;font-weight:500;min-height:28px;display:flex;align-items:center}
.ref details summary::-webkit-details-marker{display:none}
.ref details summary::after{content:"＋";margin-left:6px;font-family:var(--font-mono)}
.ref details[open] summary::after{content:"－"}
.ref details .kv{margin-top:6px;font-size:13px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
@media (min-width:768px){.filters{grid-template-columns:2fr 1fr}}
details.more summary{list-style:none;font-size:var(--fs-meta);color:var(--color-accent);cursor:pointer;font-weight:500;min-height:36px;display:flex;align-items:center}
details.more summary::-webkit-details-marker{display:none}

/* Q&A long-form */
.qa{max-width:68ch}
.qa h3{font-size:15px;margin:22px 0 6px;font-family:var(--font-sans)}
.qa p,.qa li{font-size:14px;color:var(--color-text-secondary);margin:4px 0;line-height:1.7}
.qa ul{padding-left:18px;margin:4px 0}

/* ============================================================
   OVERLAY / TOAST
   ============================================================ */
.overlay{position:fixed;inset:0;background:rgba(17,19,17,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade 140ms var(--ease)}
.sheet{background:var(--color-background);width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow:auto;border-radius:12px 12px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));animation:up 200ms var(--ease)}
.sheet h3{font-family:var(--font-display);font-size:20px;margin-bottom:8px}
@media (min-width:768px){.overlay{align-items:center}.sheet{border-radius:10px}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(16px);opacity:.6}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);background:var(--color-text-primary);color:var(--color-background);padding:10px 16px;border-radius:var(--r);font-size:14px;z-index:60;max-width:90vw;animation:fade 140ms var(--ease)}
@media (min-width:1024px){.toast{bottom:24px;margin-left:calc(var(--side-w)/2)}}
.back{background:none;border:0;color:var(--color-accent);padding:14px 0 0;font-size:14px;min-height:44px;font-weight:500}
.foot{font-size:var(--fs-cap);color:var(--color-text-tertiary);margin:28px 0 8px;padding-top:12px;border-top:1px solid var(--color-border)}

/* ---- step-by-step today ---- */
.stepbar{display:flex;align-items:center;gap:12px;margin:16px 0 4px;font-size:14px;color:var(--color-text-secondary)}
.stepbar b{color:var(--color-text-primary)}
.stepbar i{flex:1;height:4px;background:var(--color-border);border-radius:2px;overflow:hidden;display:block}
.stepbar s{display:block;height:100%;background:var(--color-accent);transition:width 240ms var(--ease)}
.sgroup{font-size:12px;letter-spacing:.12em;color:var(--color-text-tertiary);margin:22px 0 6px;font-weight:600}
.step{display:grid;grid-template-columns:32px 1fr auto;gap:0 12px;padding:14px 0;border-top:1px solid var(--color-border);align-items:start}
.step .sn{width:28px;height:28px;border:1.5px solid var(--color-border-strong);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:13px;color:var(--color-text-secondary);margin-top:1px}
.step .sb{min-width:0;grid-column:2/3}
.step .st1{font-size:17px;font-weight:600;line-height:1.4}
.step .st2{font-size:15px;color:var(--color-text-secondary);margin-top:4px;line-height:1.6}
.step.cur{background:var(--color-surface);border:1px solid var(--color-border-strong);border-left:3px solid var(--color-accent);border-radius:0 var(--r) var(--r) 0;padding:16px 14px 16px 12px;margin:6px 0}
.step.cur .sn{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-on-accent)}
.step.done{padding:10px 0;align-items:center}
.step.done .st1{font-size:15px;font-weight:500;color:var(--color-text-tertiary)}
.step.done .st2{font-size:13px;margin-top:1px;color:var(--color-text-tertiary)}
.step.done .sn{background:var(--color-accent-soft);border-color:transparent}
.step.done .sn i{width:6px;height:11px;border:solid var(--color-accent);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px);display:block}
.nexttag{display:inline-block;font-size:11px;font-weight:600;color:var(--color-accent);border:1px solid var(--color-accent);border-radius:var(--r-sm);padding:0 5px;margin-left:6px;vertical-align:2px;letter-spacing:.04em}
.alldone{margin:24px 0;padding:22px 16px;text-align:center;border:1px solid var(--color-border);border-radius:var(--r);background:var(--color-surface);color:var(--color-text-secondary);font-size:15px;line-height:1.8}
.alldone b{font-family:var(--font-display);font-size:20px;color:var(--color-text-primary)}

/* ---- v3: agenda ---- */
.agenda{border-top:1px solid var(--color-border)}
.ag{display:grid;grid-template-columns:44px 1fr auto;gap:0 10px;align-items:center;min-height:64px;padding:10px 0;border-bottom:1px solid var(--color-border)}
.ag-slot{font-size:11px;color:var(--color-text-tertiary);letter-spacing:.04em;line-height:1.3}
.ag-t{font-size:16px;font-weight:600;line-height:1.35}
.ag-m{font-size:12.5px;color:var(--color-text-tertiary);margin-top:2px}
.ag-m .ok{color:var(--color-success)}.ag-m .warn{color:var(--color-warning)}
.ag-r{display:flex;align-items:center;gap:2px}
.ag.is-next{background:linear-gradient(90deg,var(--color-accent-soft),transparent 70%);box-shadow:inset 3px 0 0 var(--color-accent);padding-left:8px;margin-left:-8px}
.ag.is-done .ag-t,.ag.is-off .ag-t{color:var(--color-text-tertiary);font-weight:500}
.more-btn{width:36px;height:44px;border:0;background:none;color:var(--color-text-tertiary);font-size:18px;letter-spacing:1px}
.resume{display:flex;align-items:center;gap:8px;padding:12px 14px;margin:14px 0 0;border:1px solid var(--color-accent);border-radius:var(--r);background:var(--color-accent-soft)}
.resume>div{flex:1;min-width:0}
/* ---- v3: session ---- */
body.in-session nav.bottom,body.in-session header.top{display:none}
body.in-session{padding-bottom:24px}
@media (min-width:1024px){body.in-session{padding-left:0}}
body.in-session main#app{max-width:560px}
.ses-top{display:flex;justify-content:space-between;align-items:center;padding-top:calc(env(safe-area-inset-top) + 6px)}
.ses-prog{margin:12px 0 0;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--color-text-secondary)}
.ses-prog i{flex:1;display:flex;gap:4px}
.ses-prog s{flex:1;height:4px;border-radius:2px;background:var(--color-border);text-decoration:none}
.ses-prog s.ok{background:var(--color-accent)}.ses-prog s.sk{background:var(--color-warning)}.ses-prog s.cur{background:var(--color-text-primary)}
.ses-title{margin-top:28px;font-size:13px;color:var(--color-text-tertiary)}
.ses-step{font-size:30px;margin:6px 0 10px;line-height:1.25}
.ses-body{font-size:18px;line-height:1.7;color:var(--color-text-secondary);margin:0 0 18px}
.ses-timer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px;border:1px solid var(--color-border-strong);border-radius:var(--r);background:var(--color-surface);margin:8px 0 16px}
.ses-timer .tv{font-size:44px;line-height:1;letter-spacing:.02em}
.ses-timer .tv.end{color:var(--color-accent)}
.ses-bar{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px;margin-top:22px;padding:10px;background:var(--color-background);border:1px solid var(--color-border);border-radius:var(--r);box-shadow:0 8px 24px -16px rgba(0,0,0,.35)}
.ses-foot{display:flex;justify-content:space-between;margin-top:6px}
/* ---- v3: lifecycle ---- */
.lc{list-style:none;margin:12px 0 4px;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.lc li{font-size:11px;text-align:center;color:var(--color-text-tertiary);padding-top:8px;border-top:3px solid var(--color-border);line-height:1.3}
.lc li.past{border-top-color:var(--color-accent-soft);color:var(--color-text-secondary)}
.lc li.on{border-top-color:var(--color-accent);color:var(--color-text-primary);font-weight:600}
.xprev{padding:12px 0;border-bottom:1px solid var(--color-border)}
/* ---- v3: calendar ---- */
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-h span{font-size:11px;color:var(--color-text-tertiary);text-align:center;padding-bottom:4px}
.cd{position:relative;min-height:54px;border:1px solid var(--color-border);border-radius:var(--r-sm);background:var(--color-surface);padding:4px 3px 3px;display:flex;flex-direction:column;align-items:center;gap:3px}
.cd b{font-size:13px;font-weight:500}
.cd i{width:80%;height:4px;background:var(--color-border);border-radius:2px;overflow:hidden;display:block}
.cd i.e{background:transparent}
.cd i s{display:block;height:100%;background:var(--color-accent)}
.cd em{font-style:normal;font-size:9px;color:var(--color-accent);line-height:1;min-height:9px}
.cd.today{border-color:var(--color-text-primary)}
.cd.sel{outline:2px solid var(--color-accent);outline-offset:1px}
.cd.miss{border-color:var(--color-danger);background:var(--color-danger-soft)}
.ok{color:var(--color-success)}.warn{color:var(--color-warning)}
</style>

/* =========================================================
   4. DATE UTILITIES（一律使用本地時間，不用 toISOString 產生日期）
   ========================================================= */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function parseYmd(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
function addDays(s,n){const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)}
function diffDays(a,b){return Math.round((parseYmd(b)-parseYmd(a))/864e5)}
function weekday(s){return (parseYmd(s).getDay()+6)%7}/* 0=一 … 6=日 */
function weekStart(s){return addDays(s,-weekday(s))}
function logicalToday(){const n=new Date();if(n.getHours()<state.settings.dayStartHour)n.setDate(n.getDate()-1);return ymd(n)}
const WD='一二三四五六日';
function fmtDate(s,withWd=true){const d=parseYmd(s);return (d.getMonth()+1)+'/'+d.getDate()+(withWd?'（'+WD[weekday(s)]+'）':'')}
function fmtTime(iso){if(!iso)return '';const d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes())}
function range(a,b){const o=[];for(let s=a;s<=b;s=addDays(s,1))o.push(s);return o}
function monthKey(s){return s.slice(0,7)}

/* =========================================================
   5. DOMAIN LOGIC
   ========================================================= */
function activeOn(ex,date){return ex&&ex.periods&&ex.periods.some(p=>date>=p.start&&(!p.end||date<=p.end))}
function expStatus(id,date){const ex=state.experiments[id];if(!ex)return 'candidate';if(ex.removed)return 'removed';
  if(activeOn(ex,date))return 'active';const last=ex.periods[ex.periods.length-1];if(last&&!last.end&&date<last.start)return 'scheduled';return 'paused'}
function tasksFor(date){
  const out=[];
  for(const id of Object.keys(state.experiments)){
    const ex=state.experiments[id];if(ex.removed||!activeOn(ex,date))continue;
    const i=diffDays(ex.periods[0].start,date);
    const list=EXP[id]?EXP[id].tasks(date,i):candTasks(id);
    list.forEach(t=>{t.exp=id;out.push(t)});
  }
  return out;
}
function day(date,create){if(!state.days[date]){if(!create)return null;state.days[date]={tasks:{},log:null}}return state.days[date]}
function taskRec(date,id){const d=day(date);return d&&d.tasks[id]||null}
function isDone(t,r){if(!r)return false;if(t.kind==='counter')return (r.count||0)>=t.min;return r.status==='done'}
function dayCompletion(date){
  const ts=tasksFor(date);let req=0,done=0,mins=0,minsDone=0;
  ts.forEach(t=>{const r=taskRec(date,t.id);if(t.kind==='cond'&&!(r&&r.status==='done'))return;if(r&&r.status==='na')return;
    req++;mins+=t.minutes;if(isDone(t,r)){done++;minsDone+=t.minutes}});
  return{req,done,rate:req?done/req:null,mins,minsDone,tasks:ts};
}
function phaseOf(date){
  const S=state.settings.startDate,B=state.settings.baselineDays,i=diffDays(S,date);
  if(i<0)return{key:'pre',label:'開始前',i};
  if(i<B)return{key:'base',label:'基準期 第 '+(Math.floor(i/7)+1)+' 週',i};
  const e01=state.experiments.E01,w=e01&&activeOn(e01,date)?Math.floor(diffDays(e01.periods[0].start,date)/7)+1:null;
  return{key:'int',label:'介入期'+(w?'・實驗 01 第 '+w+' 週':''),i,w};
}
function logOf(date){const d=day(date);return d&&d.log||null}
function streak(today){let n=0,s=today;if(!logOf(s))s=addDays(s,-1);while(logOf(s)){n++;s=addDays(s,-1)}return n}
function aggCompletion(dates){let req=0,done=0;dates.forEach(s=>{const c=dayCompletion(s);req+=c.req;done+=c.done});return{req,done,rate:req?done/req:null}}
function taskStats(dates){
  const m={};
  dates.forEach(s=>{tasksFor(s).forEach(t=>{const r=taskRec(s,t.id);
    const o=m[t.id]||(m[t.id]={title:t.title,exp:t.exp,kind:t.kind,sched:0,done:0,skip:0,na:0,reasons:{}});
    o.sched++;if(isDone(t,r))o.done++;else if(r&&r.status==='na')o.na++;else if(r&&r.status==='skipped'){o.skip++;o.reasons[r.reason]=(o.reasons[r.reason]||0)+1}});});
  Object.values(m).forEach(o=>{const den=o.kind==='cond'?o.done+o.skip:o.sched-o.na;o.rate=den?o.done/den:null});
  return m;
}
function expAdherence(id,dates){const st=taskStats(dates);let den=0,num=0;Object.values(st).filter(o=>o.exp===id&&o.kind!=='cond'&&o.kind!=='measure').forEach(o=>{den+=o.sched-o.na;num+=o.done});return den?num/den:null}
const METRICS=[['sleepH','睡眠時數','h',0,12],['sleepQ','睡眠品質','',1,10],['alert','起床精神','',1,10],['clarity','精神清晰度','',1,10],['focus','專注程度','',1,10],['memory','主觀記憶','',1,10],['fatigue','身體疲勞（高＝累）','',1,10],['soreness','肌肉痠痛（高＝痠）','',1,10]];
function vals(dates,k){return dates.map(s=>{const l=logOf(s);return l&&l[k]!=null&&l[k]!==''?+l[k]:null})}
function sd(a){const v=a.filter(x=>x!=null&&!isNaN(x));if(v.length<2)return null;const m=v.reduce((p,c)=>p+c,0)/v.length;return Math.sqrt(v.reduce((p,c)=>p+(c-m)**2,0)/(v.length-1))}
function mean(a){const v=a.filter(x=>x!=null&&!isNaN(x));return v.length?{m:v.reduce((p,c)=>p+c,0)/v.length,n:v.length}:{m:null,n:0}}
function periodsSplit(today){
  const S=state.settings.startDate,B=state.settings.baselineDays,bEnd=addDays(S,B-1),iStart=addDays(S,B);
  const P={base:today>=S?range(S,today<bEnd?today:bEnd):[]};
  if(today>=iStart){const all=range(iStart,today),k=Math.ceil(all.length/3);P.early=all.slice(0,k);P.mid=all.slice(k,2*k);P.late=all.slice(2*k)}
  else{P.early=[];P.mid=[];P.late=[]}
  return P;
}
function sleepHours(bed,wake){if(!bed||!wake)return null;const[b1,b2]=bed.split(':').map(Number),[w1,w2]=wake.split(':').map(Number);let m=(w1*60+w2)-(b1*60+b2);if(m<=0)m+=1440;return Math.round(m/6)/10}
function e01WeekRange(date){const ex=state.experiments.E01;if(!ex||!activeOn(ex,date))return null;const s0=ex.periods[0].start,i=diffDays(s0,date),w=Math.floor(i/7)+1;const a=addDays(s0,(w-1)*7);return{w,a,b:addDays(a,6)}}
function wbtbUsed(a,b){return range(a,b).filter(s=>{const l=logOf(s);return l&&l.e01&&l.e01.wbtb}).length}
function guardAlert(date){const q=[0,1].map(k=>{const l=logOf(addDays(date,-k));return l&&l.sleepQ?+l.sleepQ:null});return q[0]!=null&&q[1]!=null&&q[0]<=4&&q[1]<=4}

function axisFrame(W,H,L,R,T,ih,min,max,ticks,y){let g='';ticks.forEach(v=>{const yy=y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"'+(v===min?'':' stroke-dasharray="1 3"')+'/><text x="'+(L-6)+'" y="'+(yy+3.5)+'" font-size="9.5" text-anchor="end" fill="var(--muted)" font-family="var(--font-mono)">'+niceNum(v)+'</text>'});return g}
function xLabels(dates,x,H,isBar){const n=dates.length,idx=n<=2?[...Array(n).keys()]:[0,Math.floor((n-1)/2),n-1];return idx.map((i,k)=>'<text x="'+x(i)+'" y="'+(H-4)+'" font-size="9.5" text-anchor="'+(k===0&&!isBar?'start':k===idx.length-1&&!isBar?'end':'middle')+'" fill="var(--muted)" font-family="var(--font-mono)">'+esc(isBar?dates[i]:fmtDate(dates[i],false))+'</text>').join('')}
function lineChart(dates,ys,min,max,unit){
  const id='c'+(chartSeq++),W=320,H=124,L=28,R=8,T=10,Bm=22,n=dates.length,iw=W-L-R,ih=H-T-Bm;
  const x=i=>L+(n<=1?iw/2:i*iw/(n-1)),y=v=>T+ih-(v-min)/(max-min)*ih;
  const ticks=[min,min+(max-min)/2,max];
  let path='',seg=false,dots='';
  ys.forEach((v,i)=>{if(v==null){seg=false;return}path+=(seg?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1);seg=true;dots+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="'+(n>45?2:3)+'" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>'});
  charts[id]={dates,ys,x,unit,W,H,T,ih};
  const has=ys.some(v=>v!=null);let band='';
  if(/^\d{4}-\d{2}-\d{2}$/.test(dates[0])){const S=state.settings.startDate,E=addDays(S,state.settings.baselineDays-1),idx=dates.map((d,i)=>d>=S&&d<=E?i:-1).filter(i=>i>=0);if(idx.length){const step=n>1?iw/(n-1):iw,x0=Math.max(L,x(idx[0])-step/2),x1=Math.min(W-R,x(idx[idx.length-1])+step/2);band='<rect x="'+x0+'" y="'+T+'" width="'+Math.max(1,x1-x0)+'" height="'+ih+'" fill="var(--color-surface-2)"/><text x="'+(x0+3)+'" y="'+(T+9)+'" font-size="8.5" fill="var(--muted)">基準期</text>'}}
  return '<div class="chart" data-chart="'+id+'"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="趨勢圖，'+n+' 天">'+band+axisFrame(W,H,L,R,T,ih,min,max,ticks,y)+(has?'<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+dots:'<text x="'+(L+iw/2)+'" y="'+(T+ih/2)+'" font-size="11" text-anchor="middle" fill="var(--muted)">尚無資料</text>')+xLabels(dates,x,H)+'<line class="cross" x1="0" x2="0" y1="'+T+'" y2="'+(T+ih)+'" stroke="var(--ink2)" stroke-width="1" stroke-dasharray="2 2" visibility="hidden"/></svg><div class="tip">點按圖表查看單日數值</div></div>';
}
function barChart(labels,ys,max,unit,fmt){
  const id='c'+(chartSeq++),W=320,H=124,L=28,R=8,T=10,Bm=22,n=labels.length,iw=W-L-R,ih=H-T-Bm,bw=Math.max(2,Math.min(22,iw/n-3));
  const x=i=>L+(i+.5)*iw/n,y=v=>T+ih-v/max*ih;let b=axisFrame(W,H,L,R,T,ih,0,max,[0,max/2,max],y).replace(/>(\d+(\.\d)?)<\/text>/g,(m,v)=>'>'+(fmt?fmt(+v):v)+'</text>');
  ys.forEach((v,i)=>{if(v==null)return;if(v===0){b+='<line x1="'+(x(i)-bw/2)+'" x2="'+(x(i)+bw/2)+'" y1="'+(T+ih-.5)+'" y2="'+(T+ih-.5)+'" stroke="var(--accent)" stroke-width="2"/>';return}const h=Math.max(1,v/max*ih),r=Math.min(3,h,bw/2);b+='<path d="M'+(x(i)-bw/2)+' '+(T+ih)+'V'+(T+ih-h+r)+'q0 -'+r+' '+r+' -'+r+'H'+(x(i)+bw/2-r)+'q'+r+' 0 '+r+' '+r+'V'+(T+ih)+'Z" fill="var(--accent)"/>'});
  b+=xLabels(labels,x,H,true);

  return '<div class="chart" data-chart="'+id+'"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="長條圖">'+b+'<line class="cross" x1="0" x2="0" y1="'+T+'" y2="'+(T+ih)+'" stroke="var(--ink2)" stroke-dasharray="2 2" visibility="hidden"/></svg><div class="tip">點按圖表查看數值（空白＝無資料，不是 0）</div></div>';
}
function spark(ys,min,max){

function chartPointer(e){
  const box=e.target.closest('.chart');if(!box)return;const c=charts[box.dataset.chart];if(!c)return;

  const ln=svg.querySelector('.cross');ln.setAttribute('x1',c.x(best));ln.setAttribute('x2',c.x(best));ln.setAttribute('visibility','visible');

}

function copyFor(t){const c=STEP_COPY[t.id];if(c)return c;return{title:t.title,line:t.how,ok:'完成',na:t.kind==='cond'?'今天不適用':null}}
function buildSteps(date){
  const ts=tasksFor(date),take=id=>{const i=ts.findIndex(t=>t.id===id);return i<0?null:ts.splice(i,1)[0]},steps=[];
  const add=(g,x)=>x&&steps.push(Object.assign({g},x.id?{type:'task',t:x}:x));
  add('起床',take('E01.diary'));add('起床',{type:'am'});
  add('白天',take('E01.rt'));add('白天',take('E02.recall'));
  ts.filter(t=>t.id.startsWith('C.')).forEach(t=>{take(t.id);add('白天',t)});
  add('睡前',{type:'pm'});add('睡前',take('E01.intent'));add('半夜',take('E01.mild'));
  ts.slice().forEach(t=>add('週日',take(t.id)));
  if(weekday(date)===6)add('週日',{type:'backup'});
  return steps;
}
function stepHandled(s,date){
  const log=logOf(date)||{};
  if(s.type==='task'){const r=taskRec(date,s.t.id);return isDone(s.t,r)||!!(r&&(r.status==='skipped'||r.status==='na'))}
  if(s.type==='am')return log.sleepQ!=null||!!log.bed;
  if(s.type==='pm')return log.clarity!=null||log.focus!=null||log.fatigue!=null;
  if(s.type==='backup')return !!(state.settings.lastExport&&ymd(new Date(state.settings.lastExport))>=date);
  return false;
}

function stepSummary(s,date){
  const l=logOf(date)||{};
  if(s.type==='am')return '睡了 '+(l.sleepH!=null?l.sleepH+' 小時':'—')+'・睡眠 '+(l.sleepQ||'—')+'/10'+(l.e01&&l.e01.dreams!=null?'・夢 '+l.e01.dreams+' 個':'');
  if(s.type==='pm')return '清楚 '+(l.clarity||'—')+'・專注 '+(l.focus||'—')+'・疲勞 '+(l.fatigue||'—');
  if(s.type==='backup')return '已備份';
  const r=taskRec(date,s.t.id);if(!r)return '';
  if(r.status==='skipped')return '今天跳過（'+r.reason+'）';if(r.status==='na')return copyFor(s.t).na||'不適用';

function buildDailyCSV(){

  const rows=[head.join(',')];

    const tc=tids.map(id=>{const r=taskRec(s,id);if(!r)return '';if(r.count!=null)return r.count;return r.status+(r.reason?':'+r.reason:'')});
    rows.push([s,ph.key,ph.i+1,l.bed,l.wake,l.sleepH,l.sleepQ,l.alert,l.clarity,l.focus,l.memory,l.fatigue,l.soreness,l.activity,(l.conf||[]).join('|'),l.caf,e.dreams,e.lucid,e.odd,e.wbtb==null?'':e.wbtb?1:0,c.done,c.req,c.rate==null?'':c.rate.toFixed(3),l.note,l.obs,l.expNote,l.finding,...tc].map(csvCell).join(','))});

    case 'jrate':{markDirty();const k=el.dataset.k,v=+el.dataset.v;jDraft[k]=jDraft[k]===v?null:v;el.parentNode.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',+b.dataset.v===jDraft[k]);b.setAttribute('aria-pressed',+b.dataset.v===jDraft[k])});const df=document.querySelector('[data-def="'+k+'"]');if(df)df.textContent=jDraft[k]?rateDef(k,jDraft[k]):'';break}
    case 'jchip':{markDirty();const k=el.dataset.k,v=el.dataset.v;jDraft[k]=jDraft[k]===v?null:v;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===jDraft[k]));break}
    case 'jsel':{markDirty();const k=el.dataset.k;let v=el.dataset.v;if(v==='true')v=true;else if(v==='false')v=false;jDraft.e01[k]=jDraft.e01[k]===v?null:v;el.parentNode.querySelectorAll('button').forEach(b=>{let bv=b.dataset.v;if(bv==='true')bv=true;else if(bv==='false')bv=false;b.classList.toggle('on',bv===jDraft.e01[k])});break}
    case 'jstep':{markDirty();const k=el.dataset.k;jDraft.e01[k]=Math.max(0,(jDraft.e01[k]||0)+(+el.dataset.d));el.parentNode.querySelector('.n').textContent=jDraft.e01[k];break}
    case 'jconf':{markDirty();const v=el.dataset.v,i=jDraft.conf.indexOf(v);i>=0?jDraft.conf.splice(i,1):jDraft.conf.push(v);el.classList.toggle('on',i<0);break}
    case 'jsave':saveJournal();break;
    case 'ptab':view.progTab=el.dataset.v;render();break;
    case 'prange':view.progRange=el.dataset.v==='all'?'all':+el.dataset.v;render();break;
    case 'wk':view.weekOf=addDays(view.weekOf||weekStart(logicalToday()),7*(+el.dataset.d));render();break;
    case 'mo':{const[y,m]=(view.monthOf||monthKey(logicalToday())).split('-').map(Number),d=new Date(y,m-1+(+el.dataset.d),1,12);view.monthOf=ymd(d).slice(0,7);render();break}
    case 'wsave':state.reviews.weekly[el.dataset.k]=$('#wnote').value;save();toast('已儲存週筆記');break;
    case 'msave':state.reviews.monthly[el.dataset.k]=$('#mnote').value;save();toast('已儲存月結論');break;
    case 'dec':{const id=el.dataset.id,mk=el.dataset.m,ex=state.experiments[id],v=el.dataset.v,note=($('#decnote-'+id)||{}).value||'';ex.decisions=ex.decisions.filter(d=>d.month!==mk);ex.decisions.push({month:mk,decision:v,note,at:new Date().toISOString()});logChange(id,'decision',mk+' 月決策：'+v+(note?'（'+note+'）':''));save();toast(expMeta(id).short+'：'+v);render();break}
    case 'rtopic':view.rtopic=el.dataset.v;render();break;
    case 'export-json':{const t=new Date();download('human-micro-experiment-'+ymd(t)+'.json',JSON.stringify(state,null,1),'application/json');state.settings.lastExport=t.toISOString();save();toast('已匯出 JSON');closeSheet();render();break}
    case 'export-csv':download('hme-daily-'+ymd(new Date())+'.csv',buildDailyCSV(),'text/csv;charset=utf-8');toast('已匯出每日 CSV');break;
    case 'export-mcsv':download('hme-measurements-'+ymd(new Date())+'.csv',buildMeasCSV(),'text/csv;charset=utf-8');toast('已匯出測量 CSV');break;
    case 'save-settings':{const sd=$('#sd').value,bd=+$('#bd').value,dh=+$('#dh').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(sd)||!(bd>=7&&bd<=28)||!(dh>=0&&dh<=8)){toast('設定值不正確');break}
      const old=state.settings.startDate;state.settings.startDate=sd;state.settings.baselineDays=bd;state.settings.dayStartHour=dh;
      const e1=state.experiments.E01;if(e1&&e1.periods.length===1&&e1.periods[0].start===old&&old!==sd){e1.periods[0].start=sd;logChange('E01','version','開始日 '+old+' → '+sd,true)}const bg=+($('#bgt')||{}).value;if(bg>=1&&bg<=120)state.settings.budget=bg;
      save();closeSheet();toast('設定已儲存');render();break}
    case 'reset':{if($('#rst').value!=='RESET'){toast('請輸入 RESET（大寫）');break}closeSheet();if(!await confirmBox('最後確認','將清除這台裝置上全部的實驗紀錄。','永久清除',true))break;
      try{localStorage.setItem(KEY+'.prev',localStorage.getItem(KEY)||'')}catch(_){} state=defaultState();save();view.date=null;jDraft=null;toast('已清除全部資料');render();break}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='rtopicSel'){view.rtopic=t.value;$('#plist').innerHTML=paperList()}
  if(t.dataset&&t.dataset.q&&view.q){view.q.am[t.dataset.q]=t.value;const h=sleepHours(view.q.am.bed,view.q.am.wake),el=$('#qsleepH');if(el)el.innerHTML=h!=null?'睡了 <span class="num">'+h+'</span> 小時':''}
  if(t.dataset&&t.dataset.j){jDraft[t.dataset.j]=t.value;markDirty();if(t.dataset.j==='bed'||t.dataset.j==='wake'){const h=sleepHours(jDraft.bed,jDraft.wake);$('#sleepH').innerHTML='睡眠時數：'+(h!=null?'<span class="num">'+h+'</span> 小時（由時間計算）':'—')}}
  if(t.dataset&&t.dataset.j1){jDraft.e01[t.dataset.j1]=t.value}
  if(t.id==='imp'&&t.files&&t.files[0]){const f=t.files[0],rd=new FileReader();rd.onload=async()=>{let o;try{o=JSON.parse(rd.result)}catch(_){toast('不是有效的 JSON 檔');return}
    if(!validImport(o)){toast('檔案格式不符（需要本 App 匯出的 version 1 備份）');return}
    closeSheet();if(!await confirmBox('匯入並取代目前資料？','檔案含 '+Object.keys(o.days).length+' 天紀錄、'+(o.measurements||[]).length+' 筆測量。目前資料會被取代（已暫存一份到本機 .prev）。','匯入',true))return;
    try{localStorage.setItem(KEY+'.prev',localStorage.getItem(KEY)||'')}catch(_){} state=o;load2();save();jDraft=null;toast('匯入完成');render()};rd.readAsText(f)}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.j&&t.tagName==='TEXTAREA'){jDraft[t.dataset.j]=t.value;markDirty()}if(t.dataset&&t.dataset.j1){jDraft.e01[t.dataset.j1]=t.value;markDirty()}if(t.id==='rq'){view.rq=t.value;$('#plist').innerHTML=paperList()}});
document.addEventListener('pointerdown',e=>{if(e.target.closest('.chart'))chartPointer(e)});
function load2(){setTimeout(()=>{ensureMeta();save()},0);state.settings=Object.assign(defaultState().settings,state.settings||{});if(!state.measurements)state.measurements=[];if(!state.reviews)state.reviews={weekly:{},monthly:{}}}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
const isTyping=el=>el&&(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&!['checkbox','radio','file','button'].includes(el.type))||el.tagName==='SELECT');
document.addEventListener('focusin',e=>{if(isTyping(e.target)&&window.matchMedia('(max-width:1023px)').matches)document.body.classList.add('kbd')});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!isTyping(document.activeElement))document.body.classList.remove('kbd')},60));
window.addEventListener('beforeunload',e=>{if(jDirty){e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!view.date)render()});

/* boot */
load();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
render();
if((state.settings.onboardV||0)<3){openOnboarding(0)}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
